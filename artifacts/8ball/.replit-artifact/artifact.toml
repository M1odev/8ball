kind = "web"
previewPath = "/"
title = "8ball"
description = "A monochrome, pixel-inspired decision app. Claude prepares context with optional web research, and Jev answers with yes/no probabilities or weighted multiple-choice options. Includes a limited free trial and support for personal Hack Club AI keys."
version = "1.0.0"
id = "artifacts/8ball"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18933

[services.development]
run = "pnpm --filter @workspace/8ball run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/8ball", "run", "build" ]
serve = "static"
publicDir = "artifacts/8ball/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18933"
BASE_PATH = "/"
