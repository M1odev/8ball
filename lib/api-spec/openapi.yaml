openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /decision/access:
    get:
      operationId: getDecisionAccess
      tags: [decision]
      responses:
        "200":
          description: Anonymous lifetime allowance and network guard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionAccess"
        "503":
          $ref: "#/components/responses/DecisionError"
  /decision/prepare:
    post:
      operationId: prepareDecision
      tags: [decision]
      parameters:
        - $ref: "#/components/parameters/VisitorKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Claude-prepared context and question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedPrompt"
        "400":
          $ref: "#/components/responses/DecisionError"
        "429":
          $ref: "#/components/responses/DecisionError"
        "502":
          $ref: "#/components/responses/DecisionError"
        "503":
          $ref: "#/components/responses/DecisionError"
  /decision/answer:
    post:
      operationId: answerDecision
      tags: [decision]
      parameters:
        - $ref: "#/components/parameters/VisitorKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreparedPrompt"
      responses:
        "200":
          description: Jev answer and option probabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "400":
          $ref: "#/components/responses/DecisionError"
        "429":
          $ref: "#/components/responses/DecisionError"
        "502":
          $ref: "#/components/responses/DecisionError"
        "503":
          $ref: "#/components/responses/DecisionError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    VisitorKey:
      name: X-8ball-key
      in: header
      required: false
      description: Optional visitor-owned Hack Club AI key; never persisted or logged.
      schema:
        type: string
        minLength: 8
        maxLength: 512
  responses:
    DecisionError:
      description: Validation, rate limit, configuration, or upstream failure
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              debugLog:
                type: array
                readOnly: true
                items:
                  type: string
  schemas:
    DecisionAccess:
      type: object
      required: [limit, remaining, networkLimited]
      properties:
        limit:
          type: integer
        remaining:
          type: integer
        networkLimited:
          type: boolean
    DecisionInput:
      type: object
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 4000
    PreparedPrompt:
      type: object
      required: [state, question, ticket]
      properties:
        ticket:
          type: string
          format: uuid
          description: Single-use, visitor-bound authorization for this exact prepared question.
        researchRounds:
          type: integer
          minimum: 0
          maximum: 1
          description: Completed research rounds, not the number of search queries.
        debugLog:
          type: array
          readOnly: true
          items:
            type: string
        state:
          type: string
          minLength: 1
          maxLength: 20000
        question:
          type: object
          required: [type, instructions]
          properties:
            type:
              type: string
              enum: [noul, choice]
            instructions:
              type: string
              minLength: 1
              maxLength: 2000
            criteria:
              type: object
              minProperties: 2
              maxProperties: 8
              additionalProperties:
                type: string
                minLength: 1
                maxLength: 300
    DecisionResult:
      type: object
      required: [type, question, answer, options]
      properties:
        researchRounds:
          type: integer
          minimum: 0
          maximum: 1
          description: Completed research rounds used to prepare this decision.
        debugLog:
          type: array
          readOnly: true
          items:
            type: string
        type:
          type: string
          enum: [noul, choice]
        question:
          type: string
        answer:
          type: string
        probability:
          type: number
          minimum: 0
          maximum: 1
        options:
          type: array
          items:
            type: object
            required: [key, label, weight]
            properties:
              key:
                type: string
              label:
                type: string
              weight:
                type: number
                minimum: 0
                maximum: 1
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

